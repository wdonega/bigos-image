<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sem conexão · Bigos Image</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fafafa;
        background: #0a0a0a;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        font-size: 20px;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #a3a3a3;
        font-size: 15px;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #fafafa;
        color: #171717;
      }
      /* Light theme when the user chose it (cookie "theme=light"); dark is the default. */
      .light body {
        color: #171717;
        background: #fff;
      }
      .light p {
        color: #737373;
      }
      .light button {
        background: #171717;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O Bigos Image precisa de internet para gerar imagens.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // Static page (served by the service worker while offline): Portuguese by default, English
      // when the browser prefers it, mirroring the app's locale rule.
      if (/(?:^|; )theme=light(?:;|$)/.test(document.cookie)) {
        document.documentElement.classList.add("light");
        document.querySelector('meta[name="theme-color"]').content = "#ffc87c";
      }
      // Portuguese is the markup; other languages follow the saved choice or the browser.
      const TEXT = {
        "en-US": ["Offline", "You are offline", "Bigos Image needs the internet to generate images.", "Try again"],
        "es-MX": ["Sin conexión", "No tienes conexión", "Bigos Image necesita internet para crear imágenes.", "Intentar de nuevo"],
        "zh-CN": ["离线", "你已离线", "Bigos Image 需要联网才能生成图片。", "重试"],
      };
      const BY_LANGUAGE = { pt: "pt-BR", en: "en-US", es: "es-MX", zh: "zh-CN" };
      const saved = (document.cookie.match(/(?:^|; )locale=([^;]+)/) || [])[1];
      const tags = [saved, ...(navigator.languages || [navigator.language])].filter(Boolean);
      const locale = tags.map((t) => BY_LANGUAGE[decodeURIComponent(t).toLowerCase().split(/[-_]/)[0]]).find(Boolean) || "en-US";
      if (TEXT[locale]) {
        const [title, heading, body, action] = TEXT[locale];
        document.documentElement.lang = locale;
        document.title = `${title} · Bigos Image`;
        document.querySelector("h1").textContent = heading;
        document.querySelector("p").textContent = body;
        document.querySelector("button").textContent = action;
      }
    </script>
  </body>
</html>
