<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffc87c" />
    <title>Sem conexão · Bigos Image</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
        color: #171717;
        background: #fff;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        font-size: 20px;
        margin: 20px 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #737373;
        font-size: 15px;
      }
      button {
        font: inherit;
        font-weight: 500;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #171717;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1 data-en="You are offline">Você está sem conexão</h1>
      <p data-en="Bigos Image needs the internet to generate images.">O Bigos Image precisa de internet para gerar imagens.</p>
      <button type="button" onclick="location.reload()" data-en="Try again">Tentar de novo</button>
    </main>
    <script>
      // Static page (served by the service worker while offline): Portuguese by default, English
      // when the browser prefers it, mirroring the app's locale rule.
      if (/^en\b/i.test(navigator.language)) {
        document.documentElement.lang = "en";
        document.title = "Offline · Bigos Image";
        for (const el of document.querySelectorAll("[data-en]")) el.textContent = el.dataset.en;
      }
    </script>
  </body>
</html>
