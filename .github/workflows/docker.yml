# Builds the Docker image for x86 (linux/amd64) and ARM (linux/arm64), publishes it to
# ghcr.io/wdonega/bigos-image and creates a GitHub Release for it. N = number of commits up to this
# one, so it grows with the history:
#   image tags  1.0.N (the version), revN and latest
#   release     v1.0.N (git tag + GitHub Release with the changes since the previous one)
# The commit SHA stays in the image label org.opencontainers.image.revision. Pull requests only
# build. To start a new line (1.1.N, 2.0.N…) change VERSION_PREFIX below.
name: Docker image

# Documentation-only changes (README, docs/, other .md files) don't build, publish or release.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write # the release and its git tag
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION_PREFIX: "1.0"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: N counts the commits.
          fetch-depth: 0

      - name: Revision and version
        id: rev
        run: |
          n=$(git rev-list --count HEAD)
          echo "rev=rev$n" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_PREFIX.$n" >> "$GITHUB_OUTPUT"

      # ARM is built under emulation on the x86 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.rev.outputs.version }}
            type=raw,value=${{ steps.rev.outputs.rev }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.rev.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only after the image is published, and only for the default branch. Tags created with
      # GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
      - name: GitHub Release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.rev.outputs.version }}
          REV: ${{ steps.rev.outputs.rev }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already exists (re-run of the same commit): nothing to do"
            exit 0
          fi
          printf '%s\n' \
            "Docker image for x86 and ARM:" \
            "" \
            '```bash' \
            "docker pull $IMAGE:$VERSION   # also tagged $REV and latest" \
            '```' \
            "" \
            "Commit: $GITHUB_SHA" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --generate-notes --latest
